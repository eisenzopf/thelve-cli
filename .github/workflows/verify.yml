name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [gcp-single-node, aws-single-node]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.5
      - name: Initialize without a backend
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data-${{ matrix.module }}
        run: terraform -chdir=modules/${{ matrix.module }} init -backend=false -input=false
      - name: Validate embedded provider module
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data-${{ matrix.module }}
        run: terraform -chdir=modules/${{ matrix.module }} validate

  no-secret-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject credentials and private product imports
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='Cargo.lock' '(AKIA[0-9A-Z]{16}|telnyx[-_ ]?(api[-_ ]?)?key.{0,4}[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' .
          ! grep -RIE --exclude-dir=.git 'thelve-(domain|db|capability|runtime-config)[[:space:]]*=' Cargo.toml src
          ! grep -RIE 'uses: [^#]+@(v[0-9]+|stable|main|master)([[:space:]]|$)' .github/workflows
